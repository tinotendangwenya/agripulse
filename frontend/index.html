<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgriPulse Zimbabwe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
  <h3 class="text-center mb-1" style="color:#1e5631">AgriPulse Zimbabwe</h3>
  <p class="text-center text-muted">Farm records, weather, markets and prices in one place</p>

  <ul class="nav nav-pills nav-fill mb-3" id="modeTabs">
    <li class="nav-item"><button class="nav-link active" data-mode="login">Log in</button></li>
    <li class="nav-item"><button class="nav-link" data-mode="register">Register</button></li>
  </ul>
  <div id="msg"></div>

  <form id="loginForm" class="card card-body">
    <label class="form-label">Email or phone</label>
    <input class="form-control mb-2" name="identifier" required autocomplete="username">
    <label class="form-label">Password</label>
    <input class="form-control mb-3" name="password" type="password" required autocomplete="current-password">
    <button class="btn btn-success">Log in</button>
  </form>

  <form id="registerForm" class="card card-body d-none">
    <label class="form-label">Full name</label>
    <input class="form-control mb-2" name="fullName" required>
    <label class="form-label">Email (optional if you give a phone)</label>
    <input class="form-control mb-2" name="email" type="email">
    <label class="form-label">Phone (optional if you give an email)</label>
    <input class="form-control mb-2" name="phone" placeholder="0771234567">
    <label class="form-label">Password (at least 8 characters)</label>
    <input class="form-control mb-2" name="password" type="password" minlength="8" required autocomplete="new-password">
    <label class="form-label">I am a</label>
    <select class="form-select mb-3" name="role">
      <option value="FARMER">Farmer</option>
      <option value="BUYER">Buyer</option>
      <option value="SUPPLIER">Input supplier</option>
      <option value="TRANSPORTER">Transporter</option>
      <option value="EQUIPMENT_OWNER">Equipment owner</option>
    </select>
    <button class="btn btn-success">Create account</button>
  </form>
</main>

<script src="/js/api.js"></script>
<script>
  const msg = document.getElementById('msg');
  const forms = { login: document.getElementById('loginForm'), register: document.getElementById('registerForm') };

  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    document.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('active', x === b));
    forms.login.classList.toggle('d-none', b.dataset.mode !== 'login');
    forms.register.classList.toggle('d-none', b.dataset.mode !== 'register');
    msg.innerHTML = '';
  });

  function done(r) {
    sessionStorage.setItem('token', r.token);
    sessionStorage.setItem('user', JSON.stringify({ id: r.userId, name: r.fullName, role: r.role }));
    location.href = '/app.html';
  }

  async function send(path, body) {
    msg.innerHTML = '';
    try { done(await API.post(path, body)); }
    catch (e) { msg.innerHTML = '<div class="alert alert-danger">' + esc(e.message) + '</div>'; }
  }

  forms.login.onsubmit = e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    send('/api/auth/login', { identifier: f.identifier, password: f.password });
  };
  forms.register.onsubmit = e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    send('/api/auth/register', {
      fullName: f.fullName, email: f.email || null, phone: f.phone || null,
      password: f.password, role: f.role
    });
  };
</script>
</body>
</html>
